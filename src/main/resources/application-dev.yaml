server:
  port: 8080
spring:
  config:
    import:
      - optional:classpath:application-local.yaml
  datasource:
    url: ${DB_URL:${local.db.url:jdbc:oracle:thin:@localhost:1522/FREEPDB1}}
    username: ${DB_USERNAME:${local.db.username:geovisionBackEnd}}
    password: ${DB_PASSWORD:${local.db.password:123456}}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    show-sql: true

    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

logging:
  level:
    pe.edu.upeu.geovision_backend: DEBUG
    pe.edu.upeu.PharmaBackend: DEBUG
    org.hibernate.orm.jdbc.bind: OFF

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://127.0.0.1:4200,http://127.0.0.1:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:w9Z6dP/dzykNH/uiI3Z/KGjBlP0H4Ji+Tuq4fm2cTNuLD4jWafu1gBL74V2SJEvy}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:480}
