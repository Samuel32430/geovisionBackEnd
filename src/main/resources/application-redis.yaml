spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

app:
  cache:
    categorias-ttl: ${REDIS_CACHE_TTL:10m}
    prefijo: ${REDIS_CACHE_PREFIX:geovision:v1:}

management:
  health:
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics
