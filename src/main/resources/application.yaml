spring:
  application:
    name: geovisionBackEnd
  profiles:
    active: dev,local
  config:
    import:
      - optional:classpath:application-local.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${local.mail.username:}}
    password: ${MAIL_PASSWORD:${local.mail.password:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:${local.mail.from:}}
    from-name: "Geo Vision - Sistema Óptico"
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  calidad:
    dioptrias: ${CALIDAD_TOLERANCIA_DIOPTRIAS:}
    eje-grados: ${CALIDAD_TOLERANCIA_EJE_GRADOS:}
    distancia-pupilar-mm: ${CALIDAD_TOLERANCIA_DP_MM:}
    prisma: ${CALIDAD_TOLERANCIA_PRISMA:}
  textbee:
    enabled: ${TEXTBEE_ENABLED:false}
    base-url: ${TEXTBEE_BASE_URL:https://api.textbee.dev/api/v1}
    api-key: ${TEXTBEE_API_KEY:}
    device-id: ${TEXTBEE_DEVICE_ID:}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  user-id: ${MP_USER_ID:}
  pos-id: ${MP_POS_ID:}
  webhook-url: ${MP_WEBHOOK_URL:}
  sandbox-mode: ${MP_SANDBOX_MODE:false}
  simulacion-habilitada: ${MP_SIMULACION_HABILITADA:true}
