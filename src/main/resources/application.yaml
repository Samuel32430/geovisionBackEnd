spring:
  application:
    name: geovisionBackEnd
  profiles:
    active: dev,local
  config:
    import:
      - optional:classpath:application-local.yaml

app:
  calidad:
    dioptrias: ${CALIDAD_TOLERANCIA_DIOPTRIAS:}
    eje-grados: ${CALIDAD_TOLERANCIA_EJE_GRADOS:}
    distancia-pupilar-mm: ${CALIDAD_TOLERANCIA_DP_MM:}
    prisma: ${CALIDAD_TOLERANCIA_PRISMA:}
  textbee:
    enabled: ${TEXTBEE_ENABLED:false}
    base-url: ${TEXTBEE_BASE_URL:https://api.textbee.dev/api/v1}
    api-key: ${TEXTBEE_API_KEY:}
    device-id: ${TEXTBEE_DEVICE_ID:}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  user-id: ${MP_USER_ID:}
  pos-id: ${MP_POS_ID:}
  webhook-url: ${MP_WEBHOOK_URL:}
  sandbox-mode: ${MP_SANDBOX_MODE:false}
